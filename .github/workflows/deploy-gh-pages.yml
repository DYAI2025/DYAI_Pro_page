name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/deploy-github-pages-*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build project
        run: |
          npm run build
          # Copy additional assets
          if [ -d DYAI_Pro_page/instafile_images ]; then
            cp -r DYAI_Pro_page/instafile_images public/
          fi
          # Ensure .nojekyll exists
          touch public/.nojekyll
          # Copy CNAME if exists
          if [ -f CNAME ]; then
            cp CNAME public/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
